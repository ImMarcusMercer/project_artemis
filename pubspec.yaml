name: artemis
description: "ResQ / Artemis healthcare emergency response prototype rebuilt in Flutter."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.9.1
  file_picker: ^8.3.7
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
